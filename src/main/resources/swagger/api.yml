openapi: 3.0.3
info:
  title: RNExchange API
  version: 1.0.0
  description: >
    RNExchange API including administrative endpoints for resetting legacy demo data and applying the curated
    trading baseline required for the RNExchange MVP (exchanges, broker, instruments,
    contracts, holidays, margin rules, and role mappings), plus M6 QA hardening endpoints
    for trader statements, broker funds journal entries, and exchange operator EOD settlement control.
servers:
  - url: https://api.rnexchange.local
    description: Local development/staging
  - url: https://api.rnexchange.prod
    description: Production
paths:
  /api/broker/overview:
    get:
      summary: Get broker-wide overview metrics and top utilization accounts
      operationId: getBrokerOverview
      tags:
        - Broker
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Overview metrics and ranked utilization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOverview'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/broker/traders:
    get:
      summary: List all traders under the authenticated broker
      operationId: listBrokerTraders
      tags:
        - Broker
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Paged list of traders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraderPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/broker/traders/{traderId}:
    get:
      summary: Get trader details and recent ledger snippet
      operationId: getBrokerTrader
      tags:
        - Broker
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: traderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trader details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraderDetails'
        '404':
          description: Not found or not under this broker
  /api/broker/traders/{tradingAccountId}/journal:
    post:
      summary: Submit a funds journal credit or debit
      operationId: createJournalEntry
      tags:
        - Broker
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tradingAccountId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalRequest'
      responses:
        '200':
          description: Applied (or duplicate with original result)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalResult'
        '400':
          description: Validation error
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Account not under this broker
  /api/orders:
    post:
      summary: Place a new cash order
      description: Submit a Market or Limit BUY/SELL order for a CASH trading account.
      operationId: createOrder
      tags:
        - Trading
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
      responses:
        '201':
          description: Order accepted (may be immediately filled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error (e.g., inactive instrument, invalid quantity, insufficient funds, non-marketable limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden for this trading account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/trading-accounts/{id}/positions:
    get:
      summary: Get positions for a trading account
      description: Returns current positions for the given CASH trading account.
      operationId: getPositionsForAccount
      tags:
        - Portfolio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Positions for this account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionView'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden for this trading account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/trading-accounts/{id}/ledger-entries:
    get:
      summary: Get cash ledger entries for a trading account
      description: Returns recent cash ledger entries (credits and debits) for the given CASH trading account.
      operationId: getLedgerEntriesForAccount
      tags:
        - Portfolio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Ledger entries for this account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntryView'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden for this trading account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/ledger-entries:
    post:
      summary: Create a funds journal entry
      description: >
        Creates a new ledger entry (e.g., broker funds credit/debit) for a trader account.
        Validation rules allow negative balances but downstream UI and statements must flag at-risk accounts.
      operationId: createLedgerEntry
      tags:
        - Ledger
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerEntryRequest'
      responses:
        '201':
          description: Ledger entry created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        '400':
          description: Validation error (e.g., missing required fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden - requires BROKER_ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/admin/baseline-seed/run:
    post:
      summary: Trigger baseline cleanup and reseed job
      description: >
        Truncates non-system tables, replays Liquibase migrations, and applies the
        `baseline` context changelog with deterministic seed data. Responds asynchronously
        with a job descriptor. Requires `EXCHANGE_OPERATOR` authority.
      operationId: runBaselineSeed
      tags:
        - baseline-seed
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineSeedRequest'
      responses:
        '202':
          description: Seed job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineSeedJob'
        '409':
          description: A seed job is already running and cannot be restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks `EXCHANGE_OPERATOR` authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/settlements/eod:
    post:
      summary: Run end-of-day settlement batch for a given trade date
      description: >
        Triggers a single-pass EOD settlement batch for the specified trade date.
        Computes settlement prices from internal data, updates positions and ledgers,
        and generates statement/report links. Idempotent per date.
      operationId: runEodSettlement
      tags:
        - Settlement
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: true
          description: Trade date to settle (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '202':
          description: EOD batch accepted and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchDTO'
        '400':
          description: Invalid date or batch already running for this date
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - requires EXCHANGE_OPERATOR role
  /api/settlements:
    get:
      summary: List settlement batches over a date range
      description: >
        Returns settlement batches (primarily EOD) for the specified date window,
        including status and simple metrics.
      operationId: listSettlementBatches
      tags:
        - Settlement
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
          description: End date (inclusive)
      responses:
        '200':
          description: Settlement batches for the given range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettlementBatchDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - requires EXCHANGE_OPERATOR role
  /api/statements:
    get:
      summary: List daily statements for the current trader
      description: >
        Returns a list of daily statements for the authenticated trader across
        their trading accounts, including dates and links to view HTML statements.
      operationId: listMyStatements
      tags:
        - Statements
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date
          description: Optional start date (inclusive)
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date
          description: Optional end date (inclusive)
      responses:
        '200':
          description: List of statements for the trader
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatementSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - requires TRADER role
  /api/statements/{statementId}/html:
    get:
      summary: View a specific daily statement as HTML
      description: >
        Returns a rendered HTML statement for the given statement identifier.
        The server ensures the statement belongs to the authenticated trader.
      operationId: getStatementHtml
      tags:
        - Statements
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: statementId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: HTML document for the daily statement
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - statement does not belong to trader
        '404':
          description: Statement not found
  /api/broker/settlements:
    get:
      summary: List settlement days and summaries for the current broker
      description: >
        Returns per-day settlement summaries for the authenticated broker, with
        aggregate P&L and balances and links to broker-level reports and client statements.
      operationId: listBrokerSettlements
      tags:
        - Broker Reports
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Broker settlement summaries for the date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrokerSettlementSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - requires BROKER_ADMIN role
  /api/admin/baseline-seed/status/{jobId}:
    get:
      summary: Fetch status of a baseline seed job
      description: Polls the lifecycle of a submitted seed job, including metrics and error messages.
      operationId: getBaselineSeedStatus
      tags:
        - baseline-seed
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current job status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineSeedJob'
        '404':
          description: Job ID not found or expired from registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks `EXCHANGE_OPERATOR` authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT issued to an `EXCHANGE_OPERATOR` user'
    basic:
      type: http
      description: Basic Authentication
      scheme: basic
  schemas:
    Money:
      type: number
      format: double
    SettlementBatchDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        refDate:
          type: string
          format: date
        kind:
          type: string
          enum:
            - EOD
            - VARIATION
            - EXPIRY
        status:
          type: string
          enum:
            - CREATED
            - PROCESSED
            - REVERSED
            - FAILED
        remarks:
          type: string
          description: Free-text or JSON summary of batch outcome
        accountsProcessed:
          type: integer
          description: Number of trading accounts processed in the batch
        positionsProcessed:
          type: integer
          description: Number of positions processed in the batch
        netPnl:
          $ref: '#/components/schemas/Money'
    StatementSummary:
      type: object
      properties:
        statementId:
          type: string
          format: uuid
        refDate:
          type: string
          format: date
        tradingAccountId:
          type: string
          format: uuid
        tradingAccountName:
          type: string
        openingBalance:
          $ref: '#/components/schemas/Money'
        closingBalance:
          $ref: '#/components/schemas/Money'
        eodMtmPnl:
          $ref: '#/components/schemas/Money'
        htmlUrl:
          type: string
          description: Relative URL to open the HTML statement
    BrokerSettlementSummary:
      type: object
      properties:
        refDate:
          type: string
          format: date
        brokerId:
          type: string
          format: uuid
        brokerName:
          type: string
        totalClientCount:
          type: integer
        totalOpeningBalance:
          $ref: '#/components/schemas/Money'
        totalClosingBalance:
          $ref: '#/components/schemas/Money'
        totalEodMtmPnl:
          $ref: '#/components/schemas/Money'
        summaryUrl:
          type: string
          description: Relative URL to open broker-level summary (CSV/HTML)
    BrokerOverview:
      type: object
      properties:
        activeTraderCount:
          type: integer
        totalCash:
          $ref: '#/components/schemas/Money'
        totalEquityExposure:
          $ref: '#/components/schemas/Money'
        topUtilization:
          type: array
          items:
            $ref: '#/components/schemas/UtilizationRow'
    UtilizationRow:
      type: object
      properties:
        traderId:
          type: string
          format: uuid
        tradingAccountId:
          type: string
          format: uuid
        traderName:
          type: string
        cash:
          $ref: '#/components/schemas/Money'
        exposure:
          $ref: '#/components/schemas/Money'
        utilizationPct:
          type: number
          minimum: 0
          maximum: 100
    TraderPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TraderSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    TraderSummary:
      type: object
      properties:
        traderId:
          type: string
          format: uuid
        name:
          type: string
        login:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        cash:
          $ref: '#/components/schemas/Money'
        currentPnl:
          $ref: '#/components/schemas/Money'
    TraderDetails:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/TraderSummary'
        recentLedger:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
    LedgerEntryRequest:
      type: object
      required:
        - tradingAccountId
        - refDate
        - amount
        - currency
        - type
        - description
      properties:
        tradingAccountId:
          oneOf:
            - type: string
              format: uuid
            - type: integer
              format: int64
          description: Trading account identifier
        refDate:
          type: string
          format: date
          description: Reference date for the ledger entry
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount (positive or negative)
        currency:
          type: string
          example: INR
          description: Currency code
        type:
          type: string
          enum:
            - JOURNAL_CREDIT
            - JOURNAL_DEBIT
            - TRADE_DEBIT
            - TRADE_CREDIT
            - FEE
            - DEPOSIT
            - WITHDRAWAL
            - EOD_MTM_CREDIT
            - EOD_MTM_DEBIT
            - OTHER
          description: >
            Ledger entry type (e.g., TRADE_DEBIT, TRADE_CREDIT, FEE, DEPOSIT, WITHDRAWAL, EOD_MTM_CREDIT, EOD_MTM_DEBIT).
        description:
          type: string
          description: Human-readable description of the entry
        reference:
          type: string
          nullable: true
          description: Optional reference identifier (e.g., order ID, settlement batch ID)
    LedgerEntry:
      type: object
      properties:
        id:
          oneOf:
            - type: string
              format: uuid
            - type: integer
              format: int64
          nullable: true
          description: Ledger entry identifier (UUID for existing entries, int64 for new entries)
        tradingAccountId:
          oneOf:
            - type: string
              format: uuid
            - type: integer
              format: int64
          description: Trading account identifier
        refDate:
          type: string
          format: date
          description: Reference date for the ledger entry
        type:
          type: string
          enum:
            - JOURNAL_CREDIT
            - JOURNAL_DEBIT
            - TRADE_DEBIT
            - TRADE_CREDIT
            - FEE
            - DEPOSIT
            - WITHDRAWAL
            - EOD_MTM_CREDIT
            - EOD_MTM_DEBIT
            - OTHER
          description: >
            Ledger entry type (e.g., TRADE_DEBIT, TRADE_CREDIT, FEE, DEPOSIT, WITHDRAWAL, EOD_MTM_CREDIT, EOD_MTM_DEBIT).
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount (positive or negative)
        currency:
          type: string
          example: INR
          description: Currency code
        description:
          type: string
          description: Human-readable description of the entry
        reference:
          type: string
          nullable: true
          description: Optional reference identifier (e.g., order ID, settlement batch ID)
        reason:
          type: string
          description: Reason for the entry (legacy field, use description when possible)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (read-only)
        createdByUserId:
          type: string
          format: uuid
          description: User ID who created the entry (read-only)
    JournalRequest:
      type: object
      required:
        - direction
        - amount
        - reason
      properties:
        direction:
          type: string
          enum:
            - credit
            - debit
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 1
    JournalResult:
      type: object
      properties:
        ledgerEntry:
          $ref: '#/components/schemas/LedgerEntry'
        account:
          type: object
          properties:
            tradingAccountId:
              type: string
              format: uuid
            cash:
              $ref: '#/components/schemas/Money'
    BaselineSeedRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Force cleanup even if tables appear empty.
        contexts:
          type: array
          items:
            type: string
          description: Optional Liquibase contexts to include (defaults to `baseline`).
    BaselineSeedJob:
      type: object
      required:
        - jobId
        - status
        - submittedAt
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - COMPLETED
            - FAILED
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        metrics:
          type: object
          additionalProperties:
            type: string
          description: Key metrics (e.g., seeded counts per entity).
        errors:
          type: array
          items:
            type: string
          description: Validation or processing errors when status is `FAILED`.
    NewOrderRequest:
      type: object
      required:
        - tradingAccountId
        - instrumentId
        - side
        - type
        - quantity
      properties:
        tradingAccountId:
          type: string
        instrumentId:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        type:
          type: string
          enum: [MARKET, LIMIT]
        quantity:
          type: integer
          minimum: 1
        limitPrice:
          type: number
          format: double
          nullable: true

    OrderResponse:
      type: object
      properties:
        id:
          type: string
        tradingAccountId:
          type: string
        instrumentId:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        type:
          type: string
          enum: [MARKET, LIMIT]
        quantity:
          type: integer
        limitPrice:
          type: number
          format: double
          nullable: true
        state:
          type: string
          enum: [NEW, ACCEPTED, FILLED, REJECTED]
        rejectionReason:
          type: string
          nullable: true
        executionPrice:
          type: number
          format: double
          nullable: true

    PositionView:
      type: object
      properties:
        instrumentId:
          type: string
        symbol:
          type: string
        quantity:
          type: integer
        averageCost:
          type: number
          format: double
        lastPrice:
          type: number
          format: double
        mtm:
          type: number
          format: double

    LedgerEntryView:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          format: double
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      required:
        - status
        - title
      properties:
        status:
          type: integer
          example: 403
        title:
          type: string
          example: Access denied
        detail:
          type: string
          description: Human-readable explanation, suitable for logs/UI.
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
security:
  - bearerAuth: []
  - basic: []
